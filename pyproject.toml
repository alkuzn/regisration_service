[project]
name = "auth-service"
version = "0.1.0"
description = "Сервис регистрации авторизации пользователей"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.0",
    "aiologger>=0.7.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "fastapi-limiter>=0.2.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.1",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "black>=26.5.1",
    "isort>=9.0.2",
    "mypy>=2.3.1",
]
test = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
auth-service = { workspace = true }

[build-system] 
requires = ["uv_build>=0.6.5,<0.7.0"] 
build-backend = "uv_build"
